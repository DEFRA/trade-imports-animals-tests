# TEMPORARY — local proving-ground only, not part of any CI pipeline.
# Superseded by docker/stack/security.compose.yml once this profile is
# proven — see workareas/analysis/zap-playwright-flow.md and zap/README.md.
services:
  zap:
    image: zaproxy/zap-stable:2.17.0
    # Host networking, not extra_hosts: the app stack's own OIDC redirects
    # always target "localhost" baked into the running containers' config,
    # not something Playwright's request can rewrite — so ZAP's "localhost"
    # must be the real host's. OrbStack's host networking makes this
    # transparent.
    network_mode: host
    # zap-automation-*.yaml reference these via ${ENV_VAR} substitution
    # (ZAP's own Automation Framework mechanism) instead of hardcoding
    # localhost — see entrypoint.sh's configure_zap_urls() for CDP's
    # equivalent.
    environment:
      ZAP_TRADE_IMPORTS_ANIMALS_FRONTEND_URL: ${ZAP_TRADE_IMPORTS_ANIMALS_FRONTEND_URL:-http://localhost:3000}
      ZAP_TRADE_IMPORTS_ANIMALS_ADMIN_URL: ${ZAP_TRADE_IMPORTS_ANIMALS_ADMIN_URL:-http://localhost:3001}
      ZAP_TRADE_IMPORTS_INS_FRONTEND_URL: ${ZAP_TRADE_IMPORTS_INS_FRONTEND_URL:-http://localhost:3002}
      ZAP_TRADE_IMPORTS_ANIMALS_BACKEND_URL: ${ZAP_TRADE_IMPORTS_ANIMALS_BACKEND_URL:-http://localhost:8085}
    volumes:
      - ./zap-automation-active.yaml:/zap/plan/zap-automation-active.yaml:ro
      - ./zap-automation-passive.yaml:/zap/plan/zap-automation-passive.yaml:ro
      - ./zap-automation-context.yaml:/zap/plan/zap-automation-context.yaml:ro
      - ../zap-report:/zap/wrk/zap-report
      # ZAP's own internal log (separate from what it prints to stdout, and
      # the only place some of its own errors ever get written), landed at
      # the same relative path CDP's entrypoint.sh copies it to, so
      # zap-run-and-gate.ts's index.html link doesn't need to know which
      # environment it's in. Bind-mounted as a file, not the whole ~/.ZAP
      # directory (which also holds session/config data) — needs to exist
      # on the host first, or Docker creates a directory here instead; see
      # package.json's _zap_clean_report, which touches it on every run.
      - ../zap-report/zap.log:/home/zap/.ZAP/zap.log
    # Matches docker/stack/backend.compose.yml's healthcheck timing
    # convention for JVM services with add-ons to load. Pair with
    # `docker compose up -d --wait` so "up" doesn't return until ZAP is
    # actually accepting requests, not just started.
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--output', '/dev/null', '--fail', 'http://localhost:${ZAP_PORT:-8090}/']
      interval: 5s
      retries: 10
      start_period: 30s
    command: >
      zap.sh -daemon -host 0.0.0.0 -port ${ZAP_PORT:-8090}
      -config api.key=${ZAP_API_KEY:-local-dev-key}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config anticsrf.tokens.token.name=crumb
