# ZAP Automation Framework plan — passive scan only, no activeScan jobs.
# Safe to run against a real deployed environment on demand, no destructive
# risk. Gating is deliberately not done here; see zap-run-and-gate.ts and
# rules.tsv. See zap-automation-active.yaml for the passive + active plan.
#
# Job/parameter reference: https://www.zaproxy.org/docs/desktop/addons/automation-framework/
env:
  contexts:
    - name: frontend
      urls:
        - http://localhost:3000
    - name: admin
      urls:
        - http://localhost:3001
    - name: ins
      urls:
        - http://localhost:3002
    - name: backend
      urls:
        - http://localhost:8085
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  # ZAP's site-tree bookkeeping lags slightly behind the last spec to finish
  # navigating — without this, the report job for whichever app finished
  # last can run before its site is registered ("invalid site" from ZAP).
  - type: delay
    parameters:
      time: '5'

  # frontend — traditional-json/traditional-html (not the -plus "with
  # requests and responses" variants, which write multiple files per alert
  # and need a directory, not a single reportFile path)
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/zap-report
      reportFile: animals-frontend-security-report
      reportTitle: 'Live-animals frontend — security scan'
    sites:
      - http://localhost:3000
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/zap-report
      reportFile: animals-frontend-security-report
      reportTitle: 'Live-animals frontend — security scan'
    sites:
      - http://localhost:3000

  # admin
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/zap-report
      reportFile: animals-admin-security-report
      reportTitle: 'Live-animals admin — security scan'
    sites:
      - http://localhost:3001
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/zap-report
      reportFile: animals-admin-security-report
      reportTitle: 'Live-animals admin — security scan'
    sites:
      - http://localhost:3001

  # ins-frontend
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/zap-report
      reportFile: ins-frontend-security-report
      reportTitle: 'INS frontend — security scan'
    sites:
      - http://localhost:3002
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/zap-report
      reportFile: ins-frontend-security-report
      reportTitle: 'INS frontend — security scan'
    sites:
      - http://localhost:3002

  # animals-backend
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/zap-report
      reportFile: animals-backend-security-report
      reportTitle: 'Live-animals backend — security scan'
    sites:
      - http://localhost:8085
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/zap-report
      reportFile: animals-backend-security-report
      reportTitle: 'Live-animals backend — security scan'
    sites:
      - http://localhost:8085
